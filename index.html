<style>
  :root{
    --bg:#000;
    --bg2:#050505;
    --panel:rgba(12,12,12,.78);
    --text:#f3f4f6;
    --muted:#9ca3af;
    --muted2:#6b7280;
    --border:rgba(255,255,255,.09);
    --border2:rgba(255,255,255,.16);
    --accent:#fff;
    --accent2:#d1d5db;
    --shadow:0 18px 50px rgba(0,0,0,.65);
    font-family:"JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;color:var(--text);background:radial-gradient(circle at top, rgba(255,255,255,.07), transparent 28%), linear-gradient(180deg,var(--bg),var(--bg2));overflow-x:hidden}
  body{position:relative}
  body.no-scroll{overflow:hidden}
  body::before,body::after{content:"";position:fixed;pointer-events:none;z-index:-3;filter:blur(40px);opacity:.38;border-radius:999px;animation:floatBlob 18s ease-in-out infinite}
  body::before{width:320px;height:320px;left:-90px;top:120px;background:radial-gradient(circle, rgba(255,255,255,.12), transparent 68%)}
  body::after{width:420px;height:420px;right:-150px;bottom:50px;background:radial-gradient(circle, rgba(255,255,255,.08), transparent 70%);animation-delay:-7s}
  @keyframes floatBlob{0%,100%{transform:translate3d(0,0,0) scale(1)}50%{transform:translate3d(18px,-24px,0) scale(1.08)}}
  canvas#matrix{position:fixed;inset:0;z-index:-2;pointer-events:none;opacity:.07}

  /* ── LOADING SCREEN ── */
  #loader{
    position:fixed;inset:0;z-index:9999;
    background:#000;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;
    transition:opacity .5s ease, transform .5s ease;
  }
  #loader.fade-out{opacity:0;pointer-events:none}
  .loader-logo{
    font-size:clamp(28px,5vw,52px);font-weight:700;letter-spacing:3px;color:#fff;
    margin-bottom:8px;
    animation:logoPulse 2s ease-in-out infinite;
  }
  @keyframes logoPulse{0%,100%{opacity:1}50%{opacity:.6}}
  .loader-dots-row{display:flex;gap:8px;margin-bottom:32px}
  .loader-dot{width:8px;height:8px;border-radius:50%;background:#fff;animation:loaderDot 1.2s ease-in-out infinite}
  .loader-dot:nth-child(2){animation-delay:.15s}
  .loader-dot:nth-child(3){animation-delay:.3s}
  @keyframes loaderDot{0%,80%,100%{transform:scale(0.6);opacity:.3}40%{transform:scale(1.1);opacity:1}}
  .loader-bar-wrap{width:min(300px,70vw);height:2px;background:rgba(255,255,255,.1);border-radius:99px;overflow:hidden;margin-bottom:28px}
  .loader-bar{height:100%;width:0%;background:#fff;border-radius:99px;transition:width .12s ease}
  .loader-splash{font-size:12px;color:var(--muted);letter-spacing:.05em;text-align:center;min-height:18px;opacity:0;animation:splashIn .4s ease .3s forwards}
  @keyframes splashIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
  .loader-count{font-size:11px;color:var(--muted2);margin-top:10px;letter-spacing:.06em}

  /* ── MAIN SHELL ── */
  .shell{width:min(100%,1760px);margin:0 auto;padding:22px 18px 120px;display:flex;flex-direction:column;gap:16px;animation:pageIn .5s ease both}
  @keyframes pageIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

  /* ── HEADER ── */
  .header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;width:100%}
  .header-left{display:flex;align-items:center;gap:12px;min-width:0}
  .dots{display:flex;gap:6px;flex-shrink:0}.dot{width:10px;height:10px;border-radius:50%}.r{background:#ff5f56}.y{background:#ffbd2e}.g{background:#27c93f}
  .title{font-size:20px;font-weight:700;letter-spacing:1px;color:var(--accent);white-space:nowrap}
  .header-actions{display:flex;gap:8px;align-items:center}

  /* ── BUTTONS ── */
  .btn{appearance:none;border:1px solid var(--border);background:linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.02));color:var(--text);font:inherit;font-size:12px;padding:9px 15px;border-radius:10px;cursor:pointer;transition:transform .12s ease,border-color .12s ease,background .12s ease;box-shadow:0 4px 16px rgba(0,0,0,.3);white-space:nowrap}
  .btn:hover{transform:translateY(-1px);border-color:var(--border2);background:linear-gradient(180deg, rgba(255,255,255,.10), rgba(255,255,255,.03))}
  .btn.primary{background:linear-gradient(180deg, rgba(255,255,255,.10), rgba(255,255,255,.04))}
  .btn:disabled{opacity:.55;cursor:not-allowed;transform:none}

  /* ── BROWSER BUTTON (top right) ── */
  #browserBtn{
    display:flex;align-items:center;gap:7px;
    padding:8px 14px;font-size:12px;
    border:1px solid var(--border2);
    background:linear-gradient(180deg, rgba(255,255,255,.08), rgba(255,255,255,.03));
    border-radius:10px;color:var(--text);cursor:pointer;font:inherit;
    transition:transform .12s ease,border-color .12s ease,background .12s ease,box-shadow .12s ease;
    box-shadow:0 4px 16px rgba(0,0,0,.4);
  }
  #browserBtn:hover{transform:translateY(-1px);border-color:rgba(255,255,255,.3);background:rgba(255,255,255,.07);box-shadow:0 8px 24px rgba(0,0,0,.5)}
  #browserBtn svg{flex-shrink:0;opacity:.85}

  /* ── SEARCH ── */
  .term{width:100%;background:var(--panel);border:1px solid rgba(255,255,255,.07);padding:12px 16px;border-radius:14px;box-shadow:var(--shadow);backdrop-filter:blur(10px);position:relative}
  .prompt{display:flex;align-items:center;gap:12px}.caret{color:var(--muted);font-weight:600;min-width:60px;font-size:14px}.input-wrap{position:relative;flex:1}
  .terminal-input{width:100%;background:transparent;border:none;outline:none;color:var(--text);font:inherit;font-size:15px;padding:5px 4px}.terminal-input::placeholder{color:var(--muted2)}

  /* ── SECTIONS ── */
  .section{width:100%;transition:opacity .18s ease,transform .18s ease,max-height .2s ease}.section.hidden-search{opacity:0;transform:translateY(-8px);pointer-events:none;max-height:0;overflow:hidden;margin-top:0}
  .section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}
  .section-title{font-size:11px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;padding:3px 8px;border:1px solid var(--border);border-radius:6px;background:rgba(255,255,255,.02)}
  .section-count{font-size:11px;color:var(--muted2)}

  /* ── FEATURED GRID ── */
  .featured-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}
  .feature-card{display:block;text-decoration:none;color:var(--text);border-radius:14px;border:1px solid var(--border);background:linear-gradient(180deg, rgba(255,255,255,.04), rgba(255,255,255,.01));padding:13px;min-height:76px;transition:transform .12s ease,border-color .12s ease,background .12s ease}
  .feature-card:hover{transform:translateY(-2px);border-color:var(--border2);background:linear-gradient(180deg, rgba(255,255,255,.07), rgba(255,255,255,.02))}
  .feature-name{font-weight:700;line-height:1.3;font-size:13px}
  .feature-meta{margin-top:6px;font-size:11px;color:var(--muted)}

  /* ── ALL GAMES GRID ── */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:8px}
  a.item{display:block;padding:11px;border-radius:12px;text-decoration:none;color:var(--text);background:linear-gradient(180deg,rgba(255,255,255,.03),rgba(255,255,255,.01));border:1px solid var(--border);font-size:12px;box-shadow:inset 0 -6px 14px rgba(0,0,0,.3);transition:transform .09s ease,border-color .09s ease,background .09s ease;min-height:78px}
  a.item:hover{transform:translateY(-3px);border-color:var(--border2);background:rgba(255,255,255,.045)}
  .name{font-weight:700;line-height:1.25;color:var(--text);font-size:12px}
  .path{font-size:10px;color:var(--muted);margin-top:7px;display:block;word-break:break-all;line-height:1.3;opacity:.65}

  /* ── GAME OVERLAY ── */
  #gameOverlay{
    position:fixed;inset:0;display:block;z-index:2000;
    background:#000;opacity:0;pointer-events:none;
    transform:translateX(100%);
    transition:transform .3s cubic-bezier(.22,.61,.36,1),opacity .2s ease
  }
  #gameOverlay.open{opacity:1;pointer-events:auto;transform:translateX(0)}
  #gameOverlay.closing{opacity:1;pointer-events:none;transform:translateX(100%)}
  #gameFrame{width:100%;height:100%;border:0;background:#000}

  /* ── BACK BUTTON (hover top-left only) ── */
  .back-sensor{
    position:fixed;left:0;top:0;
    width:70px;height:100%;
    z-index:2100;pointer-events:auto;
    opacity:0;
  }
  .back-sensor.show{opacity:1}
  .back-button{
    position:absolute;top:12px;left:12px;
    width:40px;height:40px;border-radius:10px;
    border:1px solid rgba(255,255,255,.22);
    background:rgba(0,0,0,.85);backdrop-filter:blur(8px);
    color:#fff;font-size:16px;cursor:pointer;
    box-shadow:0 6px 20px rgba(0,0,0,.5);
    display:flex;align-items:center;justify-content:center;
    opacity:0;
    transform:translateX(-6px);
    transition:opacity .15s ease,transform .15s ease,background .12s ease,border-color .12s ease;
  }
  .back-sensor.show .back-button{opacity:1;transform:translateX(0)}
  .back-button:hover{background:rgba(30,30,30,.95);border-color:rgba(255,255,255,.4)}
  .back-button svg{display:block}

  /* ── BROWSER OVERLAY ── */
  #browserOverlay{
    position:fixed;inset:0;z-index:3000;
    background:#000;opacity:0;pointer-events:none;
    transform:translateY(100%);
    transition:transform .3s cubic-bezier(.22,.61,.36,1),opacity .2s ease;
    display:flex;flex-direction:column;
  }
  #browserOverlay.open{opacity:1;pointer-events:auto;transform:translateY(0)}
  #browserOverlay.closing{opacity:1;pointer-events:none;transform:translateY(100%)}
  .browser-bar{
    display:flex;align-items:center;gap:10px;
    padding:10px 14px;
    background:rgba(8,8,8,.95);
    border-bottom:1px solid rgba(255,255,255,.08);
    flex-shrink:0;
  }
  .browser-close{
    width:36px;height:36px;border-radius:9px;
    border:1px solid rgba(255,255,255,.15);
    background:rgba(255,255,255,.04);
    color:#fff;font-size:14px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;transition:background .12s ease,border-color .12s ease;
  }
  .browser-close:hover{background:rgba(255,255,255,.09);border-color:rgba(255,255,255,.28)}
  .browser-url-bar{
    flex:1;background:rgba(255,255,255,.05);
    border:1px solid rgba(255,255,255,.1);
    border-radius:9px;padding:8px 12px;
    color:var(--muted);font:inherit;font-size:12px;
    outline:none;
  }
  #browserFrame{width:100%;flex:1;border:0;background:#fff}

  /* ── TOAST ── */
  .toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:4000;padding:9px 14px;border-radius:999px;border:1px solid var(--border);background:rgba(0,0,0,.9);color:var(--text);font-size:12px;box-shadow:0 14px 40px rgba(0,0,0,.5);display:none;max-width:min(92vw, 560px);text-align:center}
  .toast.show{display:block}

  html[data-theme="monochrome"]{--bg:#000;--bg2:#050505;--panel:rgba(12,12,12,.78);--text:#f3f4f6;--muted:#9ca3af;--muted2:#6b7280;--border:rgba(255,255,255,.09);--border2:rgba(255,255,255,.16);--accent:#fff;--accent2:#d1d5db}
  html[data-theme="neon"]{--bg:#05020a;--bg2:#0d0820;--panel:rgba(15,10,24,.78);--text:#f7f2ff;--muted:#c4b5fd;--muted2:#9f86ff;--border:rgba(196,181,253,.18);--border2:rgba(245,208,254,.28);--accent:#f5d0fe;--accent2:#e9d5ff}
  html[data-theme="arctic"]{--bg:#041019;--bg2:#081827;--panel:rgba(8,18,30,.82);--text:#ecfeff;--muted:#a5f3fc;--muted2:#67e8f9;--border:rgba(165,243,252,.18);--border2:rgba(207,250,254,.30);--accent:#cffafe;--accent2:#a5f3fc}

  @media(max-width:820px){.shell{padding:16px 12px 90px}.grid{grid-template-columns:repeat(auto-fill,minmax(100px,1fr))}.featured-grid{grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}}
</style>
</head>

// ── LOADING SCREEN ──
const splash = SPLASH_TEXTS[Math.floor(Math.random() * SPLASH_TEXTS.length)];
loaderSplash.textContent = splash;

function runLoader() {
  const total = 100;
  let progress = 0;
  const start = performance.now();
  const duration = 1400;

  function tick() {
    const elapsed = performance.now() - start;
    const t = Math.min(elapsed / duration, 1);
    // Ease out cubic
    progress = 1 - Math.pow(1 - t, 3);
    const pct = Math.round(progress * total);
    loaderBar.style.width = pct + '%';
    loaderCount.textContent = pct + '% — ' + Math.round(progress * files.length) + ' games indexed';

    if (t < 1) {
      requestAnimationFrame(tick);
    } else {
      loaderBar.style.width = '100%';
      loaderCount.textContent = '100% — ' + files.length + ' games ready';
      setTimeout(dismissLoader, 320);
    }
  }
  requestAnimationFrame(tick);
}

function dismissLoader() {
  loaderEl.classList.add('fade-out');
  setTimeout(() => { loaderEl.style.display = 'none'; }, 520);
}

// ── UTILS ──
function showToast(msg) { toast.textContent = msg; toast.classList.add('show'); clearTimeout(showToast._t); showToast._t = setTimeout(() => toast.classList.remove('show'), 2200); }
function escapeHtml(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function prettyName(name) { if (SPECIAL_NAMES.has(name)) return SPECIAL_NAMES.get(name); return name.split('/').join(' / ').replace(/[-_]+/g,' ').replace(/\s+/g,' ').trim().split(' ').map(w => !w || /^\d+$/.test(w) || /^[A-Z0-9.]+$/.test(w) ? w : w[0].toUpperCase() + w.slice(1)).join(' ').replace(/\bIo\b/g,'IO'); }
function toPath(name) { return './' + name.split('/').map(encodeURIComponent).join('/') + '/'; }
function toPrettyPath(name) { return '/' + name; }
function cycleTheme() { themeIndex = (themeIndex + 1) % THEMES.length; applyTheme(THEMES[themeIndex].key); }
function applyTheme(key) { document.documentElement.dataset.theme = key; localStorage.setItem('ui-theme', key); const t = THEMES.find(x => x.key === key) || THEMES[0]; themeBtn.textContent = `Theme: ${t.name}`; themeIndex = Math.max(0, THEMES.findIndex(x => x.key === key)); }

// ── RENDER ──
function renderFeatured() {
  featuredGrid.innerHTML = '';
  featured.forEach(name => {
    const a = document.createElement('a');
    a.className = 'feature-card';
    a.href = '#';
    a.innerHTML = `<div class="feature-name">${escapeHtml(prettyName(name))}</div><div class="feature-meta">${escapeHtml(toPrettyPath(name))}</div>`;
    a.addEventListener('click', ev => { ev.preventDefault(); openGame(name); });
    featuredGrid.appendChild(a);
  });
}

function renderGrid(q='') {
  const filtered = files.filter(v => v.toLowerCase().includes(q.toLowerCase()));
  grid.innerHTML = '';
  filtered.forEach(name => {
    const a = document.createElement('a');
    a.className = 'item';
    a.href = '#';
    a.innerHTML = `<div class="name">${escapeHtml(prettyName(name))}</div><div class="path">${escapeHtml(toPrettyPath(name))}</div>`;
    a.addEventListener('click', ev => { ev.preventDefault(); openGame(name); });
    grid.appendChild(a);
  });
  gameCount.textContent = filtered.length + ' games';
}

// ── GAME ──
function openGame(name, push = true) {
  gameFrame.src = toPath(name);
  gameOverlay.classList.remove('closing');
  gameOverlay.classList.add('open');
  gameOverlay.setAttribute('aria-hidden','false');
  document.body.classList.add('no-scroll');
  gameOpen = true;
  backSensor.classList.remove('show');
  if (push) history.pushState({ view:'game', name }, '', '#game=' + encodeURIComponent(name));
}

function closeGame(fromPop = false) {
  gameOverlay.classList.add('closing');
  gameOverlay.classList.remove('open');
  gameOverlay.setAttribute('aria-hidden','true');
  backSensor.classList.remove('show');
  document.body.classList.remove('no-scroll');
  gameOpen = false;
  setTimeout(() => { gameFrame.src = 'about:blank'; gameOverlay.classList.remove('closing'); }, 340);
  if (!fromPop && location.hash.startsWith('#game=')) history.replaceState({}, '', location.pathname + location.search);
}

// ── BROWSER ──
function openBrowser() {
  if (browserFrame.src === 'about:blank') {
    browserFrame.src = 'https://scramjet-app-jsmm.onrender.com';
  }
  browserOverlay.classList.remove('closing');
  browserOverlay.classList.add('open');
  browserOverlay.setAttribute('aria-hidden','false');
  document.body.classList.add('no-scroll');
  browserOpen = true;
}

function closeBrowser() {
  browserOverlay.classList.add('closing');
  browserOverlay.classList.remove('open');
  browserOverlay.setAttribute('aria-hidden','true');
  document.body.classList.remove('no-scroll');
  browserOpen = false;
  setTimeout(() => browserOverlay.classList.remove('closing'), 340);
}

// ── EVENTS ──
themeBtn.addEventListener('click', cycleTheme);
backBtn.addEventListener('click', () => closeGame(false));
browserBtn.addEventListener('click', openBrowser);
browserClose.addEventListener('click', closeBrowser);

// Back sensor — hover top-left only
backSensor.addEventListener('mouseenter', () => { if (gameOpen) backSensor.classList.add('show'); });
backSensor.addEventListener('mouseleave', () => { if (gameOpen) backSensor.classList.remove('show'); });
window.addEventListener('mousemove', e => {
  if (!gameOpen) return;
  backSensor.classList.toggle('show', e.clientX <= 70);
});

window.addEventListener('popstate', () => { if (gameOpen) closeGame(true); });

window.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (browserOpen) { closeBrowser(); return; }
    if (gameOpen) { closeGame(false); return; }
  }
  if (e.shiftKey && e.key === 'B' && gameOpen) {
    closeGame(false);
  }
});

input.addEventListener('input', () => {
  const q = input.value;
  renderGrid(q);
  recommendationsSection.classList.toggle('hidden-search', q.trim().length > 0);
});

input.addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    const q = input.value.trim();
    if (!q) return;
    const match = files.find(f => f.toLowerCase().includes(q.toLowerCase()));
    if (match) openGame(match);
  }
  if (e.key === 'Escape') { input.value = ''; renderGrid(''); recommendationsSection.classList.remove('hidden-search'); }
});

// ── INIT ──
(function init() {
  renderFeatured();
  renderGrid('');
  applyTheme(localStorage.getItem('ui-theme') || 'monochrome');

  // Hash-based direct game load
  if (location.hash.startsWith('#game=')) {
    const decoded = decodeURIComponent(location.hash.slice(6));
    if (files.includes(decoded)) {
      // Start loading immediately, dismiss loader fast
      history.replaceState({ view:'game', name:decoded }, '', location.hash);
      // Show loader briefly then open game
      let p = 0;
      const quick = setInterval(() => {
        p = Math.min(p + 12, 100);
        loaderBar.style.width = p + '%';
        if (p >= 100) {
          clearInterval(quick);
          dismissLoader();
          setTimeout(() => openGame(decoded, false), 200);
        }
      }, 60);
      return;
    }
  }

  // Normal load
  runLoader();

  window.addEventListener('hashchange', () => {
    if (location.hash.startsWith('#game=')) {
      const decoded = decodeURIComponent(location.hash.slice(6));
      if (files.includes(decoded) && !gameOpen) openGame(decoded, false);
    }
  });
})();

// ── MATRIX ──
(function matrix() {
  const c = document.getElementById('matrix');
  const ctx = c.getContext('2d');
  let cols, drops;
  const chars = '01<>/\\|[]{}abcdefghijklmnopqrstuvwxyz0123456789'.split('');
  function resize() { c.width = window.innerWidth; c.height = window.innerHeight; cols = Math.max(6, Math.floor(c.width / 14)); drops = Array.from({length:cols}, () => Math.floor(Math.random() * 40)); }
  window.addEventListener('resize', resize);
  resize();
  function step() {
    ctx.fillStyle = 'rgba(0,0,0,0.06)';
    ctx.fillRect(0,0,c.width,c.height);
    ctx.font = '12px "JetBrains Mono", monospace';
    const cw = c.width / Math.max(1, cols);
    for (let i = 0; i < cols; i++) {
      ctx.fillStyle = 'rgba(255,255,255,0.14)';
      ctx.fillText(chars[Math.floor(Math.random()*chars.length)], i*cw+6, drops[i]*14);
      drops[i]++;
      if (drops[i]*14 > c.height || Math.random() > 0.995) drops[i] = 0;
    }
    requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
})();
</script>
